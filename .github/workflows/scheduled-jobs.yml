name: Scheduled jobs

# Render's free instance sleeps when idle, so node-cron inside the server never
# fires reliably. These schedules drive the same job logic over HTTP instead.
on:
  schedule:
    - cron: '0 * * * *'   # reminders — hourly
    - cron: '0 5 * * 0'   # weekly review — 08:00 Israel while IDT (UTC+3)
    - cron: '0 6 * * 0'   # weekly review — 08:00 Israel while IST (UTC+2)
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run now
        type: choice
        options:
          - reminders
          - weekly-review
        default: reminders

jobs:
  reminders:
    if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'reminders')
    runs-on: ubuntu-latest
    steps:
      # --retry handles the cold start: the first request to a sleeping free
      # instance can take ~50s, and may fail outright before the server is up.
      - name: POST /api/jobs/reminders
        run: |
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --retry 4 --retry-all-errors --retry-delay 20 --max-time 180 \
            "${{ secrets.BACKEND_URL }}/api/jobs/reminders"

  weekly-review:
    if: github.event.schedule == '0 5 * * 0' || github.event.schedule == '0 6 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-review')
    runs-on: ubuntu-latest
    steps:
      # Actions cron is UTC-only and cannot express a timezone, so both possible
      # UTC hours are scheduled above and the wrong one is dropped here. The
      # per-user week claim in weekly-review.service.js is the second safety net.
      - name: POST /api/jobs/weekly-review
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            HOUR=$(TZ=Asia/Jerusalem date +%H)
            echo "Israel local time is $(TZ=Asia/Jerusalem date) (hour=$HOUR)"
            if [ "$HOUR" != "08" ]; then
              echo "Not 08:00 Israel — this run is the other DST offset. Skipping."
              exit 0
            fi
          fi
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --retry 4 --retry-all-errors --retry-delay 20 --max-time 300 \
            "${{ secrets.BACKEND_URL }}/api/jobs/weekly-review"
