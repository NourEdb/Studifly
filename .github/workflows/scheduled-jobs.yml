name: Scheduled jobs

# Render's free instance sleeps when idle, so node-cron inside the server never
# fires reliably. These schedules drive the same job logic over HTTP instead.
on:
  schedule:
    - cron: '0 * * * *'   # hourly — drives both jobs below
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run now
        type: choice
        options:
          - reminders
          - weekly-review
        default: reminders

jobs:
  reminders:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'reminders')
    runs-on: ubuntu-latest
    steps:
      # --retry handles the cold start: the first request to a sleeping free
      # instance can take ~50s, and may fail outright before the server is up.
      - name: POST /api/jobs/reminders
        run: |
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --retry 4 --retry-all-errors --retry-delay 20 --max-time 180 \
            "${{ secrets.BACKEND_URL }}/api/jobs/reminders"

  weekly-review:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-review')
    runs-on: ubuntu-latest
    steps:
      # GitHub Actions' free-tier cron is best-effort and can skip a scheduled
      # run entirely — this is exactly what happened: both the 05:00 and
      # 06:00 UTC attempts aimed at landing on "08:00 Israel" were skipped,
      # and the review never went out that week. Rather than depend on one or
      # two specific hours landing, this checks on EVERY hourly tick whether
      # it's currently Sunday (the week just ended, report it) or Monday (a
      # fallback in case every Sunday tick got skipped) in Israel, and calls
      # the endpoint if so — ~24-48 chances across the window instead of 2.
      # Calling it repeatedly is safe: the per-user week claim in
      # weekly-review.service.js means the first successful call each week
      # claims and sends for every eligible user, and every later call that
      # same week is a no-op for them.
      - name: POST /api/jobs/weekly-review
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            DOW=$(TZ=Asia/Jerusalem date +%u)  # ISO day-of-week: 1=Monday … 7=Sunday
            echo "Israel local time is $(TZ=Asia/Jerusalem date) (day-of-week=$DOW)"
            if [ "$DOW" != "7" ] && [ "$DOW" != "1" ]; then
              echo "Not Sunday or Monday in Israel — skipping."
              exit 0
            fi
          fi
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --retry 4 --retry-all-errors --retry-delay 20 --max-time 300 \
            "${{ secrets.BACKEND_URL }}/api/jobs/weekly-review"
